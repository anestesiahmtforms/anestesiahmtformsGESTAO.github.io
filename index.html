<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f5c5c">
  <meta name="description" content="Segmento de Gestao SAHMT">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Segmento de Gestao SAHMT</title>
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero__logo-lockup" aria-label="Logo SAHMT Segmento de Gestao">
        <img class="hero__logo-image" src="assets/sahmt-logo.png" alt="Logo SAHMT">
        <div class="hero__logo-ribbon">Segmento de Gestao</div>
      </div>
    </header>

    <main>
      <section class="icon-grid" id="iconGrid" aria-label="Areas de gestao"></section>
    </main>

    <footer class="footer-actions">
      <a class="return-button" href="https://anestesiahmtforms.github.io/?from=gestao&skipNotice=1">
        Retorne ao App
      </a>
    </footer>
  </div>

  <template id="cardTemplate">
    <article class="icon-card">
      <div class="icon-card__orb">
        <div class="icon-card__glyph" aria-hidden="true"></div>
      </div>
      <div class="icon-card__content">
        <h2></h2>
      </div>
      <div class="icon-card__actions">
        <a class="icon-card__button icon-card__button--primary" data-role="gestor" href="#" target="_blank" rel="noopener noreferrer">
          Gestor
        </a>
        <a class="icon-card__button icon-card__button--secondary" data-role="equipe" href="#" target="_blank" rel="noopener noreferrer">
          Equipe
        </a>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
